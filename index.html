<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>じゃんけん道場</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* Layout: one-screen arena — CPU hand on top, call-out in the middle, your three hands at the bottom; scoreboard as a wooden plaque */
:root {
  --bg: #eef1f7;
  --paper: #ffffff;
  --ink: #1d2340;
  --muted: #6a7193;
  --ai: #2b3a8c;        /* 藍色 accent */
  --sun: #f5b82e;       /* highlight */
  --win: #1f8a5b;
  --lose: #c4473a;
  --draw: #8a7a2b;
  --line: #d6dbea;
  --display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --body: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Yu Gothic", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12152a; --paper: #1c2140; --ink: #eef0fa; --muted: #9aa1c4;
    --ai: #8fa2ff; --sun: #f7c650; --win: #4cc48c; --lose: #ff7a6b; --draw: #d8c56a;
    --line: #2d3460; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12152a; --paper: #1c2140; --ink: #eef0fa; --muted: #9aa1c4;
  --ai: #8fa2ff; --sun: #f7c650; --win: #4cc48c; --lose: #ff7a6b; --draw: #d8c56a;
  --line: #2d3460; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px;
  box-sizing: border-box;
}
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px; }
header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--display); font-weight: 400; font-size: 1.9rem; margin: 0; letter-spacing: .04em; color: var(--ai); }
.reset { font: inherit; font-size: .85rem; background: none; border: 1px solid var(--line); color: var(--muted); border-radius: 999px; padding: 4px 12px; cursor: pointer; }
.reset:hover { color: var(--ink); border-color: var(--muted); }

.board { display: grid; grid-template-columns: repeat(4, 1fr); background: var(--paper); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.board div { padding: 10px 6px; text-align: center; display: flex; flex-direction: column; gap: 2px; }
.board div + div { border-left: 1px solid var(--line); }
.board small { font-size: .72rem; color: var(--muted); letter-spacing: .08em; }
.board b { font-family: var(--display); font-weight: 400; font-size: 1.6rem; font-variant-numeric: tabular-nums; }
.board .w b { color: var(--win); } .board .l b { color: var(--lose); } .board .d b { color: var(--draw); }

.arena { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; padding: 18px 16px 22px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
.side { font-size: .78rem; color: var(--muted); letter-spacing: .12em; }
.hand { font-size: 4.6rem; line-height: 1; height: 5rem; display: grid; place-items: center; }
.cpu .hand { transform: rotate(180deg); }
.call { font-family: var(--display); font-size: 2.2rem; min-height: 2.8rem; text-align: center; letter-spacing: .06em; }
.call.win { color: var(--win); } .call.lose { color: var(--lose); } .call.draw { color: var(--draw); }
.sub { color: var(--muted); font-size: .9rem; min-height: 1.3em; text-align: center; }
.vs { width: 100%; display: flex; justify-content: space-around; align-items: center; }
.vs > div { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shake .hand { animation: shake .22s ease-in-out infinite alternate; }
.shake .cpu .hand { animation-name: shake-r; }
@keyframes shake { from { transform: translateY(-8px); } to { transform: translateY(8px); } }
@keyframes shake-r { from { transform: rotate(180deg) translateY(-8px); } to { transform: rotate(180deg) translateY(8px); } }
.pop { animation: pop .35s ease-out; }
@keyframes pop { from { transform: scale(.6); opacity: .3; } to { transform: scale(1); opacity: 1; } }

.picks { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.pick {
  font: inherit; cursor: pointer; background: var(--paper); color: var(--ink);
  border: 2px solid var(--line); border-radius: 16px; padding: 14px 4px 10px;
  display: flex; flex-direction: column; align-items: center; gap: 4px;
  transition: transform .12s, border-color .12s, background .12s;
}
.pick span { font-size: 2.6rem; line-height: 1; }
.pick strong { font-weight: 700; font-size: 1rem; }
.pick em { font-style: normal; font-size: .7rem; color: var(--muted); }
.pick:hover:not(:disabled) { transform: translateY(-3px); border-color: var(--ai); }
.pick:focus-visible { outline: 3px solid var(--sun); outline-offset: 2px; }
.pick:disabled { opacity: .5; cursor: default; }
.pick.chosen { border-color: var(--sun); background: color-mix(in srgb, var(--sun) 16%, var(--paper)); opacity: 1; }

.log h2 { font-size: .8rem; color: var(--muted); letter-spacing: .12em; font-weight: 700; margin: 0 0 6px; }
.log ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 6px; }
.log li { font-size: .85rem; padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); background: var(--paper); }
.log li.win { border-color: var(--win); color: var(--win); }
.log li.lose { border-color: var(--lose); color: var(--lose); }
.log li.draw { border-color: var(--draw); color: var(--draw); }
.log p { margin: 0; font-size: .85rem; color: var(--muted); }

.account { background: var(--paper); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; font-size: .88rem; }
.account p { margin: 0; color: var(--muted); }
.account form { display: flex; flex-wrap: wrap; gap: 8px; }
.account input { flex: 1 1 160px; min-width: 0; font: inherit; padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--ink); }
.account input:focus-visible, .account button:focus-visible, .reset:focus-visible { outline: 3px solid var(--sun); outline-offset: 1px; }
.account .btns { display: flex; gap: 8px; }
.account button { font: inherit; font-weight: 700; cursor: pointer; border-radius: 10px; padding: 7px 14px; border: 1px solid var(--ai); background: var(--ai); color: var(--paper); }
.account button.ghost { background: none; color: var(--ai); }
.account button:disabled { opacity: .5; cursor: default; }
.account .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.account .who { color: var(--ink); font-weight: 700; overflow-wrap: anywhere; min-width: 0; }
.account .msg { color: var(--ai); min-height: 1.2em; }
.account .msg.err { color: var(--lose); }

@media (max-width: 400px) { .hand { font-size: 3.8rem; height: 4.2rem; } .call { font-size: 1.8rem; } }
@media (prefers-reduced-motion: reduce) { .shake .hand, .pop { animation: none !important; } .pick { transition: none; } }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <h1>じゃんけん道場</h1>
    <button class="reset" id="reset" type="button">記録をリセット</button>
  </header>

  <section class="account" aria-label="アカウント">
    <div id="loggedOut">
      <p>ログインすると、記録がクラウドに保存されて別の端末でも見られます。</p>
      <form id="authForm">
        <input id="email" type="email" placeholder="メールアドレス" autocomplete="email" required>
        <input id="password" type="password" placeholder="パスワード（6文字以上）" autocomplete="current-password" minlength="6" required>
        <div class="btns">
          <button type="submit" id="loginBtn">ログイン</button>
          <button type="button" id="signupBtn" class="ghost">新規登録</button>
        </div>
      </form>
    </div>
    <div id="loggedIn" class="row" hidden>
      <span>☁️ <span class="who" id="who"></span> の記録を保存中</span>
      <button type="button" id="logoutBtn" class="ghost">ログアウト</button>
    </div>
    <p class="msg" id="authMsg"></p>
  </section>

  <section class="board" aria-label="成績">
    <div class="w"><small>勝ち</small><b id="sW">0</b></div>
    <div class="l"><small>負け</small><b id="sL">0</b></div>
    <div class="d"><small>あいこ</small><b id="sD">0</b></div>
    <div><small>連勝</small><b id="sS">0</b></div>
  </section>

  <section class="arena" id="arena" aria-live="polite">
    <div class="vs">
      <div class="cpu"><span class="side">あいて</span><div class="hand" id="cpuHand">✊</div></div>
      <div class="you"><span class="side">あなた</span><div class="hand" id="youHand">✊</div></div>
    </div>
    <div class="call" id="call">さあ、勝負！</div>
    <div class="sub" id="sub">下から手を選んでね（キー 1・2・3 でもOK）</div>
  </section>

  <section class="picks" aria-label="手を選ぶ">
    <button class="pick" id="p0" type="button" data-h="0"><span>✊</span><strong>グー</strong><em>1</em></button>
    <button class="pick" id="p1" type="button" data-h="1"><span>✌️</span><strong>チョキ</strong><em>2</em></button>
    <button class="pick" id="p2" type="button" data-h="2"><span>✋</span><strong>パー</strong><em>3</em></button>
  </section>

  <section class="log">
    <h2>これまでの勝負</h2>
    <ol id="log"></ol>
    <p id="empty">まだ勝負していません。</p>
  </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
(() => {
  const SUPABASE_URL = "https://zmndjbhacbwuktwsbuaq.supabase.co";
  const SUPABASE_KEY = "sb_publishable_5B0xHvZo8UtZRoAJ7PWCuQ_v5NTTEXN";
  const sb = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY) : null;
  let user = null;

  const HANDS = [
    { e: "✊", n: "グー" },
    { e: "✌️", n: "チョキ" },
    { e: "✋", n: "パー" },
  ];
  const $ = id => document.getElementById(id);
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const KEY = "janken-dojo-v1";

  let st = { w: 0, l: 0, d: 0, streak: 0, best: 0, log: [] };
  try { const s = JSON.parse(localStorage.getItem(KEY)); if (s) st = { ...st, ...s }; } catch {}
  let busy = false, aiko = false;

  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch {} };

  // 0 = draw, 1 = you win, 2 = you lose
  const judge = (y, c) => (y - c + 3) % 3 === 0 ? 0 : (c - y + 3) % 3 === 1 ? 1 : 2;

  function render() {
    $("sW").textContent = st.w; $("sL").textContent = st.l;
    $("sD").textContent = st.d; $("sS").textContent = st.streak;
    const ol = $("log"); ol.innerHTML = "";
    st.log.slice(-12).reverse().forEach(r => {
      const li = document.createElement("li");
      li.className = ["draw", "win", "lose"][r.r];
      li.textContent = `${HANDS[r.y].e} vs ${HANDS[r.c].e} ${["あいこ", "勝ち", "負け"][r.r]}`;
      ol.appendChild(li);
    });
    $("empty").hidden = st.log.length > 0;
  }

  const wait = ms => new Promise(r => setTimeout(r, reduce ? ms / 4 : ms));

  async function play(y) {
    if (busy) return;
    busy = true;
    document.querySelectorAll(".pick").forEach(b => { b.disabled = true; b.classList.toggle("chosen", +b.dataset.h === y); });
    const arena = $("arena"), call = $("call"), sub = $("sub");
    call.className = "call"; sub.textContent = "";
    $("cpuHand").textContent = "✊"; $("youHand").textContent = "✊";
    arena.classList.add("shake");
    const words = aiko ? ["あい", "こで", "しょ！"] : ["じゃん", "けん", "ぽん！"];
    for (let i = 0; i < 2; i++) { call.textContent = words[i]; await wait(380); }
    arena.classList.remove("shake");

    const c = Math.floor(Math.random() * 3);
    const r = judge(y, c);
    call.textContent = words[2];
    for (const [id, h] of [["cpuHand", c], ["youHand", y]]) {
      const el = $(id); el.textContent = HANDS[h].e;
      el.classList.remove("pop"); void el.offsetWidth; el.classList.add("pop");
    }
    await wait(450);

    st.log.push({ y, c, r }); if (st.log.length > 50) st.log.shift();
    if (r === 1) { st.w++; st.streak++; st.best = Math.max(st.best, st.streak); }
    else if (r === 2) { st.l++; st.streak = 0; }
    else st.d++;
    save(); render();
    cloudSaveRound({ y, c, r });

    call.className = "call " + ["draw", "win", "lose"][r];
    call.textContent = ["あいこ！", "勝ち！", "負け…"][r];
    const total = st.w + st.l;
    const rate = total ? Math.round(st.w / total * 100) : 0;
    sub.textContent = r === 0
      ? "もう一回！ 手を選んで「あいこでしょ」"
      : `あなた ${HANDS[y].n} ／ あいて ${HANDS[c].n}　勝率 ${rate}%・最高 ${st.best} 連勝`;
    aiko = r === 0;

    document.querySelectorAll(".pick").forEach(b => b.disabled = false);
    busy = false;
  }

  document.querySelectorAll(".pick").forEach(b => b.addEventListener("click", () => play(+b.dataset.h)));
  addEventListener("keydown", e => { if (["1", "2", "3"].includes(e.key)) play(+e.key - 1); });
  $("reset").addEventListener("click", () => {
    if (busy) return;
    st = { w: 0, l: 0, d: 0, streak: 0, best: 0, log: [] }; aiko = false;
    save(); render();
    cloudReset();
    $("call").className = "call"; $("call").textContent = "さあ、勝負！";
    $("sub").textContent = "記録をリセットしました";
    document.querySelectorAll(".pick").forEach(b => b.classList.remove("chosen"));
  });

  // ---- Supabase クラウド保存 ----
  const msg = (t, err = false) => { const m = $("authMsg"); m.textContent = t; m.classList.toggle("err", err); };
  const statsRow = () => ({ user_id: user.id, wins: st.w, losses: st.l, draws: st.d, streak: st.streak, best_streak: st.best, updated_at: new Date().toISOString() });

  async function cloudSaveRound(round) {
    if (!sb || !user) return;
    const [a, b] = await Promise.all([
      sb.from("janken_rounds").insert({ you: round.y, cpu: round.c, result: round.r }),
      sb.from("janken_stats").upsert(statsRow()),
    ]);
    if (a.error || b.error) msg("クラウドに保存できませんでした。通信を確認してください。", true);
  }

  async function cloudReset() {
    if (!sb || !user) return;
    const [a, b] = await Promise.all([
      sb.from("janken_rounds").delete().eq("user_id", user.id),
      sb.from("janken_stats").upsert(statsRow()),
    ]);
    msg(a.error || b.error ? "クラウドの記録を消せませんでした。" : "クラウドの記録もリセットしました", !!(a.error || b.error));
  }

  // ログイン時: クラウドに記録があれば読み込む。なければ今の記録を最初の記録として保存。
  async function cloudLoad() {
    const { data, error } = await sb.from("janken_stats").select("*").maybeSingle();
    if (error) { msg("記録を読み込めませんでした。", true); return; }
    if (!data) {
      await sb.from("janken_stats").upsert(statsRow());
      if (st.log.length) await sb.from("janken_rounds").insert(st.log.map(r => ({ you: r.y, cpu: r.c, result: r.r })));
      msg("この端末の記録をクラウドに保存しました");
      return;
    }
    const { data: rounds } = await sb.from("janken_rounds").select("you,cpu,result").order("played_at", { ascending: false }).limit(50);
    st = {
      w: data.wins, l: data.losses, d: data.draws, streak: data.streak, best: data.best_streak,
      log: (rounds || []).reverse().map(r => ({ y: r.you, c: r.cpu, r: r.result })),
    };
    save(); render();
    msg("クラウドの記録を読み込みました");
  }

  function showAuth() {
    $("loggedOut").hidden = !!user;
    $("loggedIn").hidden = !user;
    $("who").textContent = user ? user.email : "";
  }

  async function auth(kind) {
    const email = $("email").value.trim(), password = $("password").value;
    if (!email || password.length < 6) { msg("メールアドレスと6文字以上のパスワードを入れてください。", true); return; }
    $("loginBtn").disabled = $("signupBtn").disabled = true;
    msg(kind === "login" ? "ログイン中…" : "登録中…");
    const { data, error } = kind === "login"
      ? await sb.auth.signInWithPassword({ email, password })
      : await sb.auth.signUp({ email, password, options: { emailRedirectTo: location.href.split("#")[0] } });
    $("loginBtn").disabled = $("signupBtn").disabled = false;
    if (error) {
      const m = error.message || "";
      msg(/Invalid login/i.test(m) ? "メールアドレスかパスワードが違います。"
        : /not confirmed/i.test(m) ? "確認メールのリンクを押してから、もう一度ログインしてください。"
        : /already registered/i.test(m) ? "このメールアドレスは登録済みです。ログインしてください。"
        : error.code === "email_address_invalid" || /is invalid/i.test(m) ? "このメールアドレスは使えません。実際に使っているメールアドレスを入れてください。"
        : /not authorized/i.test(m) ? "確認メールを送れませんでした。しばらくしてからもう一度試してください。"
        : error.status === 429 || /rate limit/i.test(m) ? "短時間に試しすぎました。少し待ってからもう一度試してください。"
        : /Password should be/i.test(m) ? "パスワードは6文字以上にしてください。"
        : "うまくいきませんでした: " + m, true);
      return;
    }
    if (kind === "signup" && !data.session) msg("確認メールを送りました。メールのリンクを押してから、ログインしてください。");
    $("password").value = "";
  }

  if (sb) {
    $("authForm").addEventListener("submit", e => { e.preventDefault(); auth("login"); });
    $("signupBtn").addEventListener("click", () => auth("signup"));
    $("logoutBtn").addEventListener("click", async () => { await sb.auth.signOut(); msg("ログアウトしました。記録はこの端末にも残っています。"); });
    sb.auth.onAuthStateChange((event, session) => {
      const was = user && user.id;
      user = session ? session.user : null;
      showAuth();
      if (user && user.id !== was) setTimeout(cloudLoad, 0);
    });
  } else {
    $("loggedOut").hidden = true;
    msg("クラウド保存を読み込めませんでした。記録はこの端末に保存されます。", true);
  }

  render();
})();
</script>
</body>
</html>
